<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AV LP Card — Quasi Crystal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #e0e0e0;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  h1 { font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 2px; }
  .subtitle { font-size: 0.62rem; color: #3a3a3a; margin-bottom: 20px; font-family: 'JetBrains Mono', monospace; }

  .card {
    width: 340px; height: 480px;
    background: #050505;
    border-radius: 18px;
    border: 1px solid #111;
    position: relative; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.9), 0 0 120px rgba(255,215,0,0.03);
  }
  .card-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .card-vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
  }
  .card-border {
    position: absolute; inset: -1px; border-radius: 18px; pointer-events: none; z-index: 3;
    background: linear-gradient(135deg, var(--accent, #ffd700) 0%, transparent 30%, transparent 70%, var(--accent, #ffd700) 100%);
    opacity: 0.15;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    padding: 1px;
  }
  .card-info {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 16px 20px; z-index: 4;
    background: linear-gradient(transparent, rgba(0,0,0,0.9));
  }
  .card-info .label { font-size: 0.48rem; text-transform: uppercase; letter-spacing: 0.15em; color: #2a2a2a; margin-bottom: 2px; }
  .card-info .value { font-size: 0.82rem; font-weight: 600; color: #fff; font-family: 'JetBrains Mono', monospace; }
  .card-info .metrics { display: flex; gap: 14px; margin-top: 8px; }
  .card-info .metric .val { font-size: 0.68rem; font-weight: 600; color: var(--accent, #ffd700); font-family: 'JetBrains Mono', monospace; }
  .card-info .metric .lbl { font-size: 0.42rem; text-transform: uppercase; letter-spacing: 0.06em; color: #2a2a2a; }

  .controls { width: 340px; display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
  .control-group { background: #080808; border: 1px solid #111; border-radius: 10px; padding: 12px 14px; }
  .control-group h3 { font-size: 0.52rem; text-transform: uppercase; letter-spacing: 0.12em; color: #2a2a2a; margin-bottom: 8px; }
  .slider-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .slider-row:last-child { margin-bottom: 0; }
  .slider-row label { font-size: 0.58rem; color: #4a4a4a; width: 68px; flex-shrink: 0; font-family: 'JetBrains Mono', monospace; }
  input[type="range"] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 2px; background: #161616; border-radius: 1px; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 10px; height: 10px; background: var(--accent, #ffd700); border-radius: 50%; cursor: pointer;
  }
  .slider-row .val { font-size: 0.58rem; color: #666; width: 28px; text-align: right; font-family: 'JetBrains Mono', monospace; }

  .scenarios { display: flex; gap: 4px; flex-wrap: wrap; }
  .scenario-btn {
    padding: 4px 10px; background: #0e0e0e; border: 1px solid #181818;
    border-radius: 5px; color: #3a3a3a; font-size: 0.58rem; cursor: pointer; transition: all 0.15s;
    font-family: 'JetBrains Mono', monospace;
  }
  .scenario-btn:hover { background: #161616; color: #666; }
  .scenario-btn.active { background: rgba(255,215,0,0.06); border-color: rgba(255,215,0,0.25); color: #ffd700; }

  .regen-btn {
    width: 100%; padding: 10px; background: #060606;
    border: 1px solid #141414; border-radius: 8px;
    color: #2a2a2a; font-size: 0.62rem; cursor: pointer; transition: all 0.15s;
    font-family: 'JetBrains Mono', monospace;
  }
  .regen-btn:hover { border-color: #2a2a2a; color: #555; }
</style>
</head>
<body>

<h1>AV LP Card</h1>
<p class="subtitle">quasi-crystalline · softmax · argmax · on-chain metrics</p>

<div class="card" id="card">
  <svg class="card-svg" id="cardSvg" viewBox="0 0 340 480"></svg>
  <div class="card-vignette"></div>
  <div class="card-border" id="cardBorder"></div>
  <div class="card-info">
    <div class="label">LP Position #0001</div>
    <div class="value" id="positionId">AG 12,450 · AU 2,490</div>
    <div class="metrics">
      <div class="metric"><div class="val" id="volValue">+2.4%</div><div class="lbl">Vol 24h</div></div>
      <div class="metric"><div class="val" id="tvlValue">$8,240</div><div class="lbl">TVL</div></div>
      <div class="metric"><div class="val" id="kValue">k = 31.0M</div><div class="lbl">Constant</div></div>
    </div>
  </div>
</div>

<div class="controls">
  <div class="control-group">
    <h3>Position Data</h3>
    <div class="slider-row"><label>Ag</label><input type="range" id="agReserve" min="100" max="100000" value="12450"><span class="val" id="agReserveVal">12K</span></div>
    <div class="slider-row"><label>Au</label><input type="range" id="auReserve" min="100" max="50000" value="2490"><span class="val" id="auReserveVal">2.5K</span></div>
    <div class="slider-row"><label>Volume</label><input type="range" id="volume" min="0" max="100" value="34"><span class="val" id="volumeVal">34</span></div>
    <div class="slider-row"><label>Volatility</label><input type="range" id="volatility" min="0" max="100" value="28"><span class="val" id="volatilityVal">28</span></div>
    <div class="slider-row"><label>Liquidity</label><input type="range" id="liquidity" min="0" max="100" value="72"><span class="val" id="liquidityVal">72</span></div>
    <div class="slider-row"><label>Age</label><input type="range" id="timeHeld" min="1" max="365" value="90"><span class="val" id="timeHeldVal">90d</span></div>
  </div>
  <div class="control-group">
    <h3>Scenarios</h3>
    <div class="scenarios">
      <button class="scenario-btn active" data-scenario="normal">Normal</button>
      <button class="scenario-btn" data-scenario="vol">Vol Spike</button>
      <button class="scenario-btn" data-scenario="whale">Whale</button>
      <button class="scenario-btn" data-scenario="deep">Deep Liq</button>
      <button class="scenario-btn" data-scenario="fresh">Fresh</button>
      <button class="scenario-btn" data-scenario="dormant">Dormant</button>
    </div>
  </div>
  <button class="regen-btn" id="regenBtn">↻ NEW SEED</button>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// Quasi-Crystalline Pattern Generator
// Faithful port of quasi.js by Robin Darobin
// with metric-driven multi-color rendering
// ═══════════════════════════════════════════════════════════════

function quasiCrystal(symmetry, lines, seed, colorMode) {
  // Seed-based pseudo-random for unique but deterministic patterns
  let s = seed;
  const rand = () => { s = (s * 16807 + 0) % 2147483647; return s / 2147483647; };

  const cx = 170, cy = 240;
  const scale = 14;
  const offsetX = 2, offsetY = 2;
  const win = 20;
  const halfMax = lines / 2;
  const magnify = 1;

  // Build symmetry vectors (deterministic — no rand() in original)
  const vx = [], vy = [], mm = [], b = [];
  for (let t = 0; t < symmetry; t++) {
    const phi = (t * 2) / symmetry * Math.PI;
    vx[t] = Math.cos(phi);
    vy[t] = Math.sin(phi);
    mm[t] = vy[t] / vx[t];
    b[t] = [];
    for (let r = 0; r < lines; r++) {
      const y1 = vy[t] * (t * 0.1132) - vx[t] * (r - halfMax);
      const x1 = vx[t] * (t * 0.2137) + vy[t] * (r - halfMax);
      b[t][r] = y1 - mm[t] * x1;
    }
  }

  const polygons = [];
  const diagonals = [];
  const maxMax = lines - 1;
  const theMax = lines - 1;
  const theMin = Math.floor(theMax / 2);

  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;

  for (let minMin = 0; minMin <= theMax; minMin += 0.4) {
    const rad1 = minMin * minMin;
    const rad2 = (minMin + 0.4) * (minMin + 0.4);

    for (let n = 1; n < theMax; n++) {
      for (let m = 1; m < theMax; m++) {
        const rad = (n - theMin) * (n - theMin) + (m - theMin) * (m - theMin);
        if (rad < rad1 || rad >= rad2) continue;

        for (let t = 0; t < symmetry - 1; t++) {
          for (let r = t + 1; r < symmetry; r++) {
            const denom = mm[r] - mm[t];
            if (Math.abs(denom) < 1e-10) continue; // skip parallel lines

            const x0 = (b[t][n] - b[r][m]) / denom;
            const y0 = mm[t] * x0 + b[t][n];

            // Boundary check (prevent glitchy out-of-bounds)
            const dx0 = (x0) / win;
            const dy0 = (y0) / win;
            if (dx0 < -0.3 || dx0 > 1.3 || dy0 < -0.3 || dy0 > 1.3) continue;

            // Validate all symmetry axes
            let flag = false;
            const index = [];
            for (let i = 0; i < symmetry; i++) {
              if (i !== t && i !== r) {
                const ddx = -x0 * vy[i] + (y0 - b[i][0]) * vx[i];
                index[i] = Math.floor(-ddx);
                if (index[i] > maxMax - 3 || index[i] < 1) { flag = true; break; }
              }
            }
            if (flag) continue;

            index[t] = n - 1;
            index[r] = m - 1;

            // Compute polygon vertices
            let px = 0, py = 0;
            for (let i = 0; i < symmetry; i++) {
              px += vx[i] * index[i];
              py += vy[i] * index[i];
            }

            // Color computation (from original quasi.js)
            let colorVal = 0;
            for (let i = 0; i < symmetry; i++) colorVal += index[i];
            while (colorVal > (symmetry - 1) / 2) colorVal -= (symmetry - 1) / 2;
            colorVal = colorVal / ((symmetry - 1) / 2) * 0.8 + 0.1;
            colorVal += Math.abs(vx[t] * vx[r] + vy[t] * vy[r]);
            if (colorVal > 1) colorVal -= 1;

            // Track bounds
            minX = Math.min(minX, px); maxX = Math.max(maxX, px);
            minY = Math.min(minY, py); maxY = Math.max(maxY, py);

            // Quad vertices
            const x1 = px, y1 = py;
            const x2 = px + vx[t], y2 = py + vy[t];
            const x3 = px + vx[t] + vx[r], y3 = py + vy[t] + vy[r];
            const x4 = px + vx[r], y4 = py + vy[r];

            polygons.push({
              points: [
                [offsetX + (0.5 * (x1 / win + 1)) * scale, offsetY + (0.5 * (y1 / win + 1)) * scale],
                [offsetX + (0.5 * (x2 / win + 1)) * scale, offsetY + (0.5 * (y2 / win + 1)) * scale],
                [offsetX + (0.5 * (x3 / win + 1)) * scale, offsetY + (0.5 * (y3 / win + 1)) * scale],
                [offsetX + (0.5 * (x4 / win + 1)) * scale, offsetY + (0.5 * (y4 / win + 1)) * scale]
              ],
              color: colorVal,
              // Store raw coords for diagonal computation
              raw: [x1, y1, x2, y2, x3, y3, x4, y4],
              symmetryAxes: [t, r]
            });

            // Diagonal data for internal structure
            const midx1 = x1 + vx[t] * 0.5, midy1 = y1 + vy[t] * 0.5;
            const midx2 = x2 + vx[r] * 0.5, midy2 = y2 + vy[r] * 0.5;
            const midx3 = x4 + vx[t] * 0.5, midy3 = y4 + vy[t] * 0.5;
            const midx4 = x3 + vx[r] * 0.5, midy4 = y3 + vy[r] * 0.5;

            const dx1 = midx1 - midx2, dy1 = midy1 - midy2;
            const dx2 = midx2 - midx3, dy2 = midy2 - midy3;
            const dist1 = dx1 * dx1 + dy1 * dy1;
            const dist2 = dx2 * dx2 + dy2 * dy2;

            diagonals.push({
              d1: [midx1, midy1, midx3, midy3],
              d2: [midx2, midy2, midx4, midy4],
              dist1, dist2,
              color: colorVal
            });
          }
        }
      }
    }
  }

  // Center and scale the pattern
  const patW = maxX - minX || 1, patH = maxY - minY || 1;
  const targetW = 260, targetH = 340;
  const scaleFit = Math.min(targetW / patW, targetH / patH) * 0.82;
  const shiftX = cx - (minX + patW / 2) * scaleFit;
  const shiftY = cy - (minY + patH / 2) * scaleFit;

  const transform = pt => [
    pt[0] * scaleFit + shiftX,
    pt[1] * scaleFit + shiftY
  ];

  const transformRaw = (x, y) => {
    const rx = offsetX + (0.5 * (x / win + 1)) * scale;
    const ry = offsetY + (0.5 * (y / win + 1)) * scale;
    return [rx * scaleFit + shiftX, ry * scaleFit + shiftY];
  };

  return {
    polygons: polygons.map(p => ({
      points: p.points.map(transform),
      color: p.color,
      axes: p.symmetryAxes
    })),
    diagonals: diagonals.map(d => ({
      d1: [transformRaw(d.d1[0], d.d1[1]), transformRaw(d.d1[2], d.d1[3])],
      d2: [transformRaw(d.d2[0], d.d2[1]), transformRaw(d.d2[2], d.d2[3])],
      dist1: d.dist1, dist2: d.dist2,
      color: d.color
    }))
  };
}

// ═══════════════════════════════════════════════════════════════
// Softmax + Argmax
// ═══════════════════════════════════════════════════════════════

function softmax(v) {
  const mx = Math.max(...v);
  const e = v.map(x => Math.exp(x - mx));
  const s = e.reduce((a, b) => a + b, 0);
  return e.map(x => x / s);
}
function argmax(v) {
  let i = 0;
  for (let j = 1; j < v.length; j++) if (v[j] > v[i]) i = j;
  return i;
}

// ═══════════════════════════════════════════════════════════════
// Data → Visual Parameters
// ═══════════════════════════════════════════════════════════════

function toVis(p) {
  const tvl = p.ag + p.au * 20;
  const ratio = p.au / Math.max(p.ag, 1);
  const act = p.vol / 100;
  const stab = 1 - p.vlt / 100;
  const depth = p.liq / 100;
  const age = Math.min(p.time / 180, 1);

  // Theme weights via softmax
  const w = softmax([
    act * 3 + p.vol / 40,
    stab * 3 + p.liq / 40,
    depth * 2.5 + tvl / 40000,
    p.vlt / 25 + (1 - stab) * 1.5,
    age * 2.5 + p.time / 150
  ]);
  const dom = argmax(w);

  // ── Quasi pattern uniqueness ──
  // Symmetry: derived from position balance ratio
  // Balanced pools → higher symmetry (harmonious)
  // Imbalanced pools → lower symmetry (chaotic)
  const balance = Math.max(0, 1 - Math.abs(ratio - 0.2) / 0.3);
  const symmetry = Math.max(3, Math.round(3 + balance * 4 + act * 2));

  // Lines (density): derived from TVL, capped for performance
  const lines = Math.max(10, Math.round(10 + Math.min(tvl / 25000, 12)));

  // Seed: unique per position (deterministic from reserves)
  const seed = ((p.ag * 7919 + p.au * 104729) % 2147483646) + 1;

  // ── Color system — high contrast, metric-driven ──
  const health = stab * 0.4 + depth * 0.4 + age * 0.2;

  // 5 theme palettes (high contrast)
  const palettes = [
    // 0: Activity (amber/fire)
    { base: [255, 180, 40], mid: [255, 120, 20], light: [255, 220, 100], glow: [255, 80, 0] },
    // 1: Stability (ice/cyan)
    { base: [40, 200, 255], mid: [20, 140, 220], light: [100, 240, 255], glow: [0, 100, 200] },
    // 2: Depth (emerald)
    { base: [50, 220, 140], mid: [20, 160, 100], light: [100, 255, 180], glow: [0, 120, 80] },
    // 3: Volatility (magenta/crimson)
    { base: [240, 60, 140], mid: [180, 30, 100], light: [255, 120, 180], glow: [140, 0, 80] },
    // 4: Age/Maturity (gold/violet)
    { base: [220, 180, 60], mid: [160, 120, 40], light: [255, 220, 100], glow: [120, 80, 20] }
  ];

  const palette = palettes[dom];

  // Volatility shifts hue within palette
  const vltShift = p.vlt / 100;
  // Activity boosts saturation
  const satBoost = 0.7 + act * 0.3;
  // Health boosts brightness
  const litBoost = 0.7 + health * 0.3;

  // Secondary palette (adjacent) for color blending
  const palette2 = palettes[(dom + 1) % 5];
  const blend = (vltShift * 0.4 + act * 0.3); // blend factor between primary and secondary

  // Compute blended colors
  const blendColor = (c1, c2, t) => [
    Math.round(c1[0] + (c2[0] - c1[0]) * t),
    Math.round(c1[1] + (c2[1] - c1[1]) * t),
    Math.round(c1[2] + (c2[2] - c1[2]) * t)
  ];

  const rgb = (c, brightness=1) =>
    `rgb(${Math.min(255, c[0]*brightness*satBoost)|0}, ${Math.min(255, c[1]*brightness*satBoost)|0}, ${Math.min(255, c[2]*brightness*satBoost)|0})`;

  const baseC = blendColor(palette.base, palette2.base, blend);
  const midC = blendColor(palette.mid, palette2.mid, blend);
  const lightC = blendColor(palette.light, palette2.light, blend);
  const glowC = blendColor(palette.glow, palette2.glow, blend);

  // Accent for UI
  const accentHex = `rgb(${baseC[0]},${baseC[1]},${baseC[2]})`;

  return {
    symmetry, lines, seed,
    baseC, midC, lightC, glowC, accentHex,
    dom, health, act,
    // For glow filter intensity
    glowIntensity: 0.3 + vltShift * 0.5
  };
}

// ═══════════════════════════════════════════════════════════════
// Render
// ═══════════════════════════════════════════════════════════════

function render(vis) {
  const svg = document.getElementById('cardSvg');
  const { symmetry, lines, seed, baseC, midC, lightC, glowC, glowIntensity } = vis;

  // Generate quasi pattern
  const data = quasiCrystal(symmetry, lines, seed);
  const { polygons, diagonals } = data;

  // ── Background glow layer ──
  const glowR = 60 + vis.act * 40;
  const glowOpacity = 0.06 + vis.act * 0.08;

  let bgGlow = `
    <defs>
      <radialGradient id="bgGlow" cx="50%" cy="45%" r="50%">
        <stop offset="0%" stop-color="rgb(${baseC[0]},${baseC[1]},${baseC[2]})" stop-opacity="${glowOpacity.toFixed(2)}"/>
        <stop offset="100%" stop-color="rgb(${baseC[0]},${baseC[1]},${baseC[2]})" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="bgGlow2" cx="50%" cy="45%" r="40%">
        <stop offset="0%" stop-color="rgb(${lightC[0]},${lightC[1]},${lightC[2]})" stop-opacity="${(glowOpacity * 0.5).toFixed(2)}"/>
        <stop offset="100%" stop-color="rgb(${lightC[0]},${lightC[1]},${lightC[2]})" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="340" height="480" fill="url(#bgGlow)"/>
    <rect width="340" height="480" fill="url(#bgGlow2)"/>
  `;

  // ── Main polygon layer ──
  let paths = '';
  polygons.forEach(p => {
    const d = 'M' + p.points.map(pt => `${pt[0].toFixed(1)},${pt[1].toFixed(1)}`).join('L') + 'Z';
    const c = p.color;

    // Each polygon gets a unique color based on its position in the structure
    // Blending between base, mid, and light based on colorVal
    let col;
    if (c < 0.33) {
      const t = c / 0.33;
      const r = Math.round(baseC[0] + (midC[0] - baseC[0]) * t);
      const g = Math.round(baseC[1] + (midC[1] - baseC[1]) * t);
      const b = Math.round(baseC[2] + (midC[2] - baseC[2]) * t);
      col = `rgb(${r},${g},${b})`;
    } else if (c < 0.66) {
      const t = (c - 0.33) / 0.33;
      const r = Math.round(midC[0] + (lightC[0] - midC[0]) * t);
      const g = Math.round(midC[1] + (lightC[1] - midC[1]) * t);
      const b = Math.round(midC[2] + (lightC[2] - midC[2]) * t);
      col = `rgb(${r},${g},${b})`;
    } else {
      const t = (c - 0.66) / 0.34;
      const r = Math.round(lightC[0] + (glowC[0] - lightC[0]) * t);
      const g = Math.round(lightC[1] + (glowC[1] - lightC[1]) * t);
      const b = Math.round(lightC[2] + (glowC[2] - lightC[2]) * t);
      col = `rgb(${r},${g},${b})`;
    }

    const fillOp = 0.06 + c * 0.12;
    const strokeOp = 0.2 + c * 0.5;
    const strokeW = 0.5 + c * 0.8;

    paths += `<path d="${d}" fill="${col}" fill-opacity="${fillOp.toFixed(2)}" stroke="${col}" stroke-width="${strokeW.toFixed(1)}" stroke-opacity="${strokeOp.toFixed(2)}"/>`;
  });

  // ── Diagonal structure lines (the internal skeleton) ──
  let diags = '';
  diagonals.forEach(d => {
    // Choose shorter diagonal for cleaner look
    const useD1 = d.dist1 <= d.dist2;
    const [d1x1, d1y1, d1x2, d1y2] = useD1 ? d.d1 : d.d2;
    const c = d.color;

    const col = c < 0.5
      ? `rgb(${lightC[0]},${lightC[1]},${lightC[2]})`
      : `rgb(${glowC[0]},${glowC[1]},${glowC[2]})`;

    const op = 0.08 + c * 0.15;
    diags += `<line x1="${d1x1.toFixed(1)}" y1="${d1y1.toFixed(1)}" x2="${d1x2.toFixed(1)}" y2="${d1y2.toFixed(1)}" stroke="${col}" stroke-width="0.4" stroke-opacity="${op.toFixed(2)}"/>`;
  });

  // ── Outer ring echo ──
  const ringData = quasiCrystal(symmetry, Math.max(5, Math.floor(lines * 0.55)), seed + 12345);
  let ring = '';
  ringData.polygons.forEach(p => {
    const d = 'M' + p.points.map(pt => `${(pt[0] * 1.04).toFixed(1)},${(pt[1] * 1.04).toFixed(1)}`).join('L') + 'Z';
    const c = p.color;
    const col = `rgb(${baseC[0]},${baseC[1]},${baseC[2]})`;
    ring += `<path d="${d}" fill="none" stroke="${col}" stroke-width="0.3" stroke-opacity="${(0.04 + c * 0.06).toFixed(2)}"/>`;
  });

  svg.innerHTML = bgGlow + ring + paths + diags;

  document.getElementById('cardBorder').style.setProperty('--accent', vis.accentHex);
  document.getElementById('card').style.setProperty('--accent', vis.accentHex);
}

// ═══════════════════════════════════════════════════════════════
// Scenarios
// ═══════════════════════════════════════════════════════════════

const S = {
  normal:  { ag: 12450, au: 2490, vol: 34, vlt: 28, liq: 72, time: 90 },
  vol:     { ag: 12450, au: 2490, vol: 82, vlt: 89, liq: 55, time: 90 },
  whale:   { ag: 3200,  au: 640,  vol: 95, vlt: 78, liq: 30, time: 90 },
  deep:    { ag: 85000, au: 17000, vol: 18, vlt: 12, liq: 95, time: 200 },
  fresh:   { ag: 1200,  au: 240,  vol: 5,  vlt: 15, liq: 40, time: 1 },
  dormant: { ag: 12450, au: 2490, vol: 1,  vlt: 3,  liq: 72, time: 300 }
};

function apply(k) {
  const s = S[k];
  document.getElementById('agReserve').value = s.ag;
  document.getElementById('auReserve').value = s.au;
  document.getElementById('volume').value = s.vol;
  document.getElementById('volatility').value = s.vlt;
  document.getElementById('liquidity').value = s.liq;
  document.getElementById('timeHeld').value = s.time;
  update();
}

function update() {
  const ag = +document.getElementById('agReserve').value;
  const au = +document.getElementById('auReserve').value;
  const vol = +document.getElementById('volume').value;
  const vlt = +document.getElementById('volatility').value;
  const liq = +document.getElementById('liquidity').value;
  const time = +document.getElementById('timeHeld').value;

  document.getElementById('agReserveVal').textContent = ag > 1000 ? (ag/1000).toFixed(1)+'K' : ag;
  document.getElementById('auReserveVal').textContent = au > 1000 ? (au/1000).toFixed(1)+'K' : au;
  document.getElementById('volumeVal').textContent = vol;
  document.getElementById('volatilityVal').textContent = vlt;
  document.getElementById('liquidityVal').textContent = liq;
  document.getElementById('timeHeldVal').textContent = time+'d';

  document.getElementById('positionId').textContent = `AG ${ag.toLocaleString()} · AU ${au.toLocaleString()}`;
  document.getElementById('volValue').textContent = `+${(vol*0.07).toFixed(1)}%`;
  document.getElementById('tvlValue').textContent = `$${((ag+au*20)/1000).toFixed(1)}K`;
  document.getElementById('kValue').textContent = `k=${((ag*au)/1e6).toFixed(1)}M`;

  render(toVis({ag, au, vol, vlt, liq, time}));
}

// ── Events ──
document.querySelectorAll('input[type="range"]').forEach(el => el.addEventListener('input', update));
document.querySelectorAll('.scenario-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.scenario-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    apply(btn.dataset.scenario);
  });
});
document.getElementById('regenBtn').addEventListener('click', () => {
  const j = (v, p) => Math.max(1, Math.round(v * (1 + (Math.random()-0.5)*p)));
  document.getElementById('agReserve').value = j(+document.getElementById('agReserve').value, 0.15);
  document.getElementById('auReserve').value = j(+document.getElementById('auReserve').value, 0.15);
  update();
});

update();
</script>
