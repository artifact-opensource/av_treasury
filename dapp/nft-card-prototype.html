<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AV LP Card — v3</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #e0e0e0;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px;
  }
  h1 { font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 2px; }
  .subtitle { font-size: 0.65rem; color: #444; margin-bottom: 24px; font-family: 'JetBrains Mono', monospace; }

  .card {
    width: 340px; height: 480px;
    background: #080808;
    border-radius: 18px;
    border: 1px solid #161616;
    position: relative; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
  }
  .card-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .card-noise {
    position: absolute; inset: 0; opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    pointer-events: none;
  }
  .card-border-accent {
    position: absolute; inset: -1px; border-radius: 18px; pointer-events: none;
    background: linear-gradient(135deg, var(--accent, #ffd700) 0%, transparent 40%, transparent 60%, var(--accent, #ffd700) 100%);
    opacity: 0.12;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    padding: 1px;
  }
  .card-info {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 18px 20px;
    z-index: 2;
    background: linear-gradient(transparent, rgba(0,0,0,0.8));
  }
  .card-info .label { font-size: 0.5rem; text-transform: uppercase; letter-spacing: 0.15em; color: #333; margin-bottom: 2px; }
  .card-info .value { font-size: 0.85rem; font-weight: 600; color: #fff; font-family: 'JetBrains Mono', monospace; }
  .card-info .metrics { display: flex; gap: 14px; margin-top: 8px; }
  .card-info .metric .val { font-size: 0.72rem; font-weight: 600; color: var(--accent, #ffd700); font-family: 'JetBrains Mono', monospace; }
  .card-info .metric .lbl { font-size: 0.45rem; text-transform: uppercase; letter-spacing: 0.08em; color: #333; }

  .controls { width: 340px; display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
  .control-group { background: #0c0c0c; border: 1px solid #161616; border-radius: 10px; padding: 12px 16px; }
  .control-group h3 { font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.12em; color: #333; margin-bottom: 8px; }
  .slider-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .slider-row:last-child { margin-bottom: 0; }
  .slider-row label { font-size: 0.6rem; color: #555; width: 72px; flex-shrink: 0; font-family: 'JetBrains Mono', monospace; }
  input[type="range"] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 2px; background: #1a1a1a; border-radius: 1px; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 10px; height: 10px; background: var(--accent, #ffd700); border-radius: 50%; cursor: pointer;
  }
  .slider-row .val { font-size: 0.6rem; color: #777; width: 32px; text-align: right; font-family: 'JetBrains Mono', monospace; }

  .scenarios { display: flex; gap: 5px; flex-wrap: wrap; }
  .scenario-btn {
    padding: 4px 10px; background: #131313; border: 1px solid #1e1e1e;
    border-radius: 5px; color: #555; font-size: 0.6rem; cursor: pointer; transition: all 0.12s;
  }
  .scenario-btn:hover { background: #1a1a1a; }
  .scenario-btn.active { background: rgba(255,215,0,0.06); border-color: rgba(255,215,0,0.2); color: #ffd700; }

  .regen-btn {
    width: 100%; padding: 10px; background: #0a0a0a;
    border: 1px solid #181818; border-radius: 8px;
    color: #444; font-size: 0.65rem; cursor: pointer; transition: all 0.12s;
  }
  .regen-btn:hover { border-color: #282828; color: #666; }
</style>
</head>
<body>

<h1>AV LP Card</h1>
<p class="subtitle">superformula · softmax · argmax · v3</p>

<div class="card" id="card">
  <svg class="card-svg" id="cardSvg" viewBox="0 0 340 480"></svg>
  <div class="card-noise"></div>
  <div class="card-border-accent" id="cardBorder"></div>
  <div class="card-info">
    <div class="label">LP Position #0001</div>
    <div class="value" id="positionId">AG 12,450 · AU 2,490</div>
    <div class="metrics">
      <div class="metric"><div class="val" id="volValue">+2.4%</div><div class="lbl">Vol 24h</div></div>
      <div class="metric"><div class="val" id="tvlValue">$8,240</div><div class="lbl">TVL</div></div>
      <div class="metric"><div class="val" id="kValue">k = 31.0M</div><div class="lbl">Constant</div></div>
    </div>
  </div>
</div>

<div class="controls">
  <div class="control-group">
    <h3>Position Data</h3>
    <div class="slider-row"><label>Ag</label><input type="range" id="agReserve" min="100" max="100000" value="12450"><span class="val" id="agReserveVal">12K</span></div>
    <div class="slider-row"><label>Au</label><input type="range" id="auReserve" min="100" max="50000" value="2490"><span class="val" id="auReserveVal">2.5K</span></div>
    <div class="slider-row"><label>Volume</label><input type="range" id="volume" min="0" max="100" value="34"><span class="val" id="volumeVal">34</span></div>
    <div class="slider-row"><label>Volatility</label><input type="range" id="volatility" min="0" max="100" value="28"><span class="val" id="volatilityVal">28</span></div>
    <div class="slider-row"><label>Liquidity</label><input type="range" id="liquidity" min="0" max="100" value="72"><span class="val" id="liquidityVal">72</span></div>
    <div class="slider-row"><label>Age</label><input type="range" id="timeHeld" min="1" max="365" value="90"><span class="val" id="timeHeldVal">90d</span></div>
  </div>
  <div class="control-group">
    <h3>Scenarios</h3>
    <div class="scenarios">
      <button class="scenario-btn active" data-scenario="normal">Normal</button>
      <button class="scenario-btn" data-scenario="vol">Vol Spike</button>
      <button class="scenario-btn" data-scenario="whale">Whale</button>
      <button class="scenario-btn" data-scenario="deep">Deep</button>
      <button class="scenario-btn" data-scenario="fresh">Fresh</button>
      <button class="scenario-btn" data-scenario="dormant">Dormant</button>
    </div>
  </div>
  <button class="regen-btn" id="regenBtn">↻ REGENERATE</button>
</div>

<script>
// ── Superformula ──
function sf(theta, m, n1, n2, n3, a, b) {
  const t1 = Math.pow(Math.abs(Math.cos(m * theta / 4) / a), n2);
  const t2 = Math.pow(Math.abs(Math.sin(m * theta / 4) / b), n3);
  const t = t1 + t2;
  return (t <= 0 || !isFinite(t)) ? 0 : Math.pow(t, -1 / n1);
}

// ── Softmax / Argmax ──
function softmax(v) {
  const mx = Math.max(...v);
  const e = v.map(x => Math.exp(x - mx));
  const s = e.reduce((a, b) => a + b, 0);
  return e.map(x => x / s);
}
function argmax(v) {
  let i = 0;
  for (let j = 1; j < v.length; j++) if (v[j] > v[i]) i = j;
  return i;
}

// ── Data → Visual ──
function toVis(p) {
  const tvl = p.ag + p.au * 20;
  const ratio = p.au / Math.max(p.ag, 1);
  const act = p.vol / 100;
  const stab = 1 - p.vlt / 100;
  const depth = p.liq / 100;
  const age = Math.min(p.time / 180, 1);

  const w = softmax([
    act * 3 + p.vol / 40,
    stab * 3 + p.liq / 40,
    depth * 2.5 + tvl / 40000,
    p.vlt / 25 + (1 - stab) * 1.5,
    age * 2.5 + p.time / 150
  ]);
  const dom = argmax(w);

  const sym = [3+act*5, 2+stab*3, 4+depth*5, 2+p.vlt/12, 5+age*5];
  const m = Math.max(2, Math.round(sym.reduce((s, i, k) => s + i * w[k], 0)));

  const n1 = 0.3 + stab * 1.2 + depth * 0.6 - (dom === 3 ? 0.2 : 0);
  const n2 = 0.8 + depth * 2.5 + age * 0.5 + (dom === 2 ? 1.2 : 0);
  const n3 = 0.8 + p.vlt / 40 + act * 0.8 + (dom === 0 ? 0.6 : 0);
  const a = 1 + (1 - depth) * 0.25;
  const b = 1 + (1 - stab) * 0.15;

  const health = stab * 0.4 + depth * 0.4 + age * 0.2;
  const hue = 30 + ratio * 25 + p.vlt * 0.08;
  const sat = 55 + act * 35;
  const lit = 40 + health * 25;
  const scale = 70 + Math.min(tvl / 2500, 90);
  const rot = (p.ag * 7 + p.au * 13) % 360;

  return { m, n1, n2, n3, a, b, hue, sat, lit, scale, rot,
           accent: `hsl(${hue}, ${sat}%, ${lit}%)` };
}

// ── Path generator ──
function mkPath(cx, cy, sc, m, n1, n2, n3, a, b, rot, steps) {
  const r = rot * Math.PI / 180;
  let d = '';
  for (let i = 0; i <= steps; i++) {
    const t = (i / steps) * Math.PI * 2;
    const v = sf(t + r * 0.01, m, n1, n2, n3, a, b);
    if (v <= 0 || !isFinite(v)) continue;
    const x = cx + v * sc * Math.cos(t);
    const y = cy + v * sc * Math.sin(t);
    d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
  }
  return d + 'Z';
}

// ── Render ──
function render(vis) {
  const svg = document.getElementById('cardSvg');
  const cx = 170, cy = 210;
  const { m, n1, n2, n3, a, b, hue, sat, lit, scale, rot } = vis;

  const base = `hsl(${hue},${sat}%,${lit}%)`;
  const light = `hsl(${hue},${sat+5}%,${lit+18}%)`;
  const dark = `hsl(${hue},${sat}%,${lit-18}%)`;

  // Main shape (200 steps — fast)
  const main = mkPath(cx, cy, scale, m, n1, n2, n3, a, b, rot, 200);
  // Inner (120 steps)
  const inner = mkPath(cx, cy, scale * 0.5, m+2, n1*0.7, n2*1.3, n3*0.8, a*0.8, b*0.8, rot+25, 120);
  // Echo rings (80 steps each)
  let echoes = '';
  for (let i = 1; i <= 3; i++) {
    const ep = mkPath(cx, cy, scale * (1 + i * 0.22), m, n1, n2, n3, a, b, rot + i * 8, 80);
    echoes += `<path d="${ep}" fill="none" stroke="${base}" stroke-width="${1 - i * 0.2}" opacity="${0.1 - i * 0.02}"/>`;
  }
  // Particles (deterministic, no DOM loop per frame)
  let pts = '';
  const seed = (m * 100 + Math.round(n1 * 50)) % 97;
  for (let i = 0; i < 30; i++) {
    const ang = ((i * 137.5 + seed) % 360) * Math.PI / 180;
    const d = ((i * 73 + seed * 7) % 100) / 100;
    const v = sf(ang + rot * 0.01, m, n1, n2, n3, a, b);
    if (v <= 0 || !isFinite(v)) continue;
    const px = cx + v * scale * d * 0.8 * Math.cos(ang);
    const py = cy + v * scale * d * 0.8 * Math.sin(ang);
    const r = (0.6 + (i % 5) * 0.3).toFixed(1);
    const op = (0.2 + (i % 4) * 0.1).toFixed(2);
    pts += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${r}" fill="${light}" opacity="${op}"/>`;
  }

  svg.innerHTML = `
    <path d="${main}" fill="${dark}" opacity="0.05"/>
    <path d="${main}" fill="none" stroke="${base}" stroke-width="2.2" opacity="0.95"/>
    ${echoes}
    <path d="${inner}" fill="none" stroke="${light}" stroke-width="1" opacity="0.4"/>
    ${pts}
  `;

  document.getElementById('cardBorder').style.setProperty('--accent', vis.accent);
  document.getElementById('card').style.setProperty('--accent', vis.accent);
}

// ── Scenarios ──
const S = {
  normal:  { ag: 12450, au: 2490, vol: 34, vlt: 28, liq: 72, time: 90 },
  vol:     { ag: 12450, au: 2490, vol: 82, vlt: 89, liq: 55, time: 90 },
  whale:   { ag: 3200,  au: 640,  vol: 95, vlt: 78, liq: 30, time: 90 },
  deep:    { ag: 85000, au: 17000, vol: 18, vlt: 12, liq: 95, time: 200 },
  fresh:   { ag: 1200,  au: 240,  vol: 5,  vlt: 15, liq: 40, time: 1 },
  dormant: { ag: 12450, au: 2490, vol: 1,  vlt: 3,  liq: 72, time: 300 }
};

function apply(k) {
  const s = S[k];
  ['agReserve','auReserve','volume','volatility','liquidity','timeHeld'].forEach((id, i) => {
    document.getElementById(id).value = s[id === 'agReserve' ? 'ag' : id === 'auReserve' ? 'au' : id === 'timeHeld' ? 'time' : id];
  });
  update();
}

function update() {
  const ag = +document.getElementById('agReserve').value;
  const au = +document.getElementById('auReserve').value;
  const vol = +document.getElementById('volume').value;
  const vlt = +document.getElementById('volatility').value;
  const liq = +document.getElementById('liquidity').value;
  const time = +document.getElementById('timeHeld').value;

  document.getElementById('agReserveVal').textContent = ag > 1000 ? (ag/1000).toFixed(1)+'K' : ag;
  document.getElementById('auReserveVal').textContent = au > 1000 ? (au/1000).toFixed(1)+'K' : au;
  document.getElementById('volumeVal').textContent = vol;
  document.getElementById('volatilityVal').textContent = vlt;
  document.getElementById('liquidityVal').textContent = liq;
  document.getElementById('timeHeldVal').textContent = time+'d';

  document.getElementById('positionId').textContent = `AG ${ag.toLocaleString()} · AU ${au.toLocaleString()}`;
  document.getElementById('volValue').textContent = `+${(vol*0.07).toFixed(1)}%`;
  document.getElementById('tvlValue').textContent = `$${((ag+au*20)/1000).toFixed(1)}K`;
  document.getElementById('kValue').textContent = `k=${((ag*au)/1e6).toFixed(1)}M`;

  render(toVis({ag, au, vol, vlt, liq, time}));
}

// ── Events ──
document.querySelectorAll('input[type="range"]').forEach(el => el.addEventListener('input', update));
document.querySelectorAll('.scenario-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.scenario-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    apply(btn.dataset.scenario);
  });
});
document.getElementById('regenBtn').addEventListener('click', () => {
  const j = (v, p) => Math.max(1, Math.round(v * (1 + (Math.random()-0.5)*p)));
  document.getElementById('agReserve').value = j(+document.getElementById('agReserve').value, 0.08);
  document.getElementById('auReserve').value = j(+document.getElementById('auReserve').value, 0.08);
  update();
});

update();
</script>
</body>
</html>
