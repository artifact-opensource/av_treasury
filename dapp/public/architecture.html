<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AV Treasury — Architecture Map</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;
  --surface:#12121a;
  --border:#1e1e2e;
  --text:#e4e4e7;
  --text-dim:#71717a;
  --accent:#00f0ff;
  --gold:#ffd700;
  --cyan:#00f0ff;
  --purple:#a855f7;
  --green:#22c55e;
  --orange:#f97316;
  --gray:#6b7280;
}
body{
  font-family:'SF Mono',Monaco,'Cascadia Code',monospace;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  height:100vh;
}
#app{display:flex;height:100vh}
#graph-container{flex:1;position:relative;overflow:hidden}
#graph-container svg{width:100%;height:100%}
#sidebar{
  width:380px;
  background:var(--surface);
  border-left:1px solid var(--border);
  overflow-y:auto;
  padding:20px;
  transition:transform 0.3s;
}
#sidebar.hidden{transform:translateX(100%)}
#header{
  position:absolute;top:0;left:0;right:380px;
  padding:16px 24px;
  background:linear-gradient(180deg,var(--bg) 0%,transparent 100%);
  z-index:10;
  display:flex;align-items:center;gap:16px;
}
#header h1{font-size:16px;font-weight:600;letter-spacing:-0.5px}
#header h1 span{color:var(--accent)}
#search{
  flex:1;max-width:400px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  padding:8px 14px;
  color:var(--text);
  font-family:inherit;font-size:13px;
  outline:none;
}
#search:focus{border-color:var(--accent)}
#stats{font-size:12px;color:var(--text-dim)}
#stats strong{color:var(--text)}
.toggle-btn{
  position:absolute;top:16px;right:16px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);padding:6px 12px;border-radius:6px;
  cursor:pointer;font-family:inherit;font-size:12px;z-index:20;
}
.node{cursor:pointer;transition:opacity 0.2s}
.node:hover{opacity:1 !important}
.node-circle{stroke-width:2px;transition:all 0.2s}
.node:hover .node-circle{stroke-width:4px;filter:brightness(1.3)}
.node-label{font-size:10px;fill:var(--text);pointer-events:none;font-weight:500}
.link{stroke-opacity:0.4;stroke-width:1.5px}
.link.dimmed{stroke-opacity:0.1}
.node.dimmed{opacity:0.2}
#sidebar h2{font-size:14px;margin-bottom:4px;color:var(--accent)}
#sidebar .addr{font-size:11px;color:var(--text-dim);word-break:break-all;margin-bottom:12px}
#sidebar .category{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;margin-bottom:16px}
#sidebar .section-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin:16px 0 8px}
.func-list{list-style:none}
.func-item{
  padding:8px 12px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:6px;
  margin-bottom:4px;
  cursor:pointer;
  transition:all 0.15s;
}
.func-item:hover{border-color:var(--accent);background:#0f1a1f}
.func-name{font-size:12px;font-weight:600;color:var(--text)}
.func-sig{font-size:10px;color:var(--text-dim);word-break:break-all;margin-top:2px}
.func-detail{display:none;padding:12px;background:var(--bg);border:1px solid var(--accent);border-radius:6px;margin-top:4px}
.func-detail.open{display:block}
.func-detail label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin-top:8px}
.func-detail span{font-size:12px;color:var(--text)}
.badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;margin-right:4px}
.badge-view{background:#1a2332;color:#60a5fa}
.badge-nonpayable{background:#1a2a1a;color:#4ade80}
.badge-payable{background:#2a1a1a;color:#f87171}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-dim)}
.legend-dot{width:10px;height:10px;border-radius:50%}
#no-selection{text-align:center;padding:40px 20px;color:var(--text-dim);font-size:13px}
.close-btn{float:right;background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px}
.close-btn:hover{color:var(--text)}
</style>
</head>
<body>
<div id="app">
  <div id="graph-container">
    <div id="header">
      <h1><span>◈</span> AV Treasury — Architecture Map</h1>
      <input id="search" placeholder="Search functions, contracts...">
      <div id="stats"></div>
    </div>
    <button class="toggle-btn" onclick="toggleSidebar()">◧ Hide Panel</button>
  </div>
  <div id="sidebar">
    <div id="no-selection">Click a contract node to explore its functions and connections</div>
    <div id="contract-detail" style="display:none">
      <button class="close-btn" onclick="deselectNode()">✕</button>
      <h2 id="detail-name"></h2>
      <div class="addr" id="detail-addr"></div>
      <div class="category" id="detail-category"></div>
      <div class="legend" id="detail-links"></div>
      <div class="section-title">Functions (<span id="func-count">0</span>)</div>
      <ul class="func-list" id="func-list"></ul>
    </div>
  </div>
</div>

<script>
let graphData = null;
let simulation = null;
let selectedNode = null;

// Category colors
const CAT_COLORS = {
  'Core Token': '#ffd700',
  'Treasury & Monetary': '#00f0ff',
  'Governance': '#a855f7',
  'Staking & NFTs': '#22c55e',
  'Oracle': '#f97316',
  'Infrastructure': '#6b7280'
};

// Load data
fetch('architecture-map.json')
  .then(r => r.json())
  .then(data => {
    graphData = data;
    document.getElementById('stats').innerHTML = 
      `<strong>${data.summary.total_contracts}</strong> contracts · ` +
      `<strong>${data.summary.total_functions}</strong> functions · ` +
      `<strong>${data.relationships.length}</strong> links`;
    renderGraph();
  });

function renderGraph() {
  const container = document.getElementById('graph-container');
  const width = container.clientWidth;
  const height = container.clientHeight;

  // Build nodes and links
  const nodes = Object.entries(graphData.contracts).map(([name, c]) => ({
    id: name,
    address: c.address,
    category: c.category,
    color: CAT_COLORS[c.category] || '#6b7280',
    functions_count: c.functions_count,
    key_functions: c.key_functions,
    links: c.links
  }));

  const links = graphData.relationships.map(r => ({
    source: r.from,
    target: r.to,
    type: r.type,
    via: r.via
  }));

  // Create SVG
  const svg = d3.select('#graph-container').append('svg')
    .attr('width', width)
    .attr('height', height);

  // Add zoom
  const g = svg.append('g');
  svg.call(d3.zoom()
    .scaleExtent([0.2, 4])
    .on('zoom', (event) => g.attr('transform', event.transform)));

  // Force simulation
  simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(120))
    .force('charge', d3.forceManyBody().strength(-400))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(40));

  // Draw links
  const link = g.append('g')
    .selectAll('line')
    .data(links)
    .join('line')
    .attr('class', 'link')
    .attr('stroke', d => {
      const sourceNode = nodes.find(n => n.id === (typeof d.source === 'object' ? d.source.id : d.source));
      return sourceNode ? sourceNode.color : '#333';
    });

  // Draw nodes
  const node = g.append('g')
    .selectAll('g')
    .data(nodes)
    .join('g')
    .attr('class', 'node')
    .call(d3.drag()
      .on('start', dragstarted)
      .on('drag', dragged)
      .on('end', dragended))
    .on('click', (event, d) => selectNode(d));

  node.append('circle')
    .attr('class', 'node-circle')
    .attr('r', d => 18 + Math.min(d.functions_count * 0.8, 14))
    .attr('fill', d => d.color + '22')
    .attr('stroke', d => d.color);

  node.append('text')
    .attr('class', 'node-label')
    .attr('text-anchor', 'middle')
    .attr('dy', d => 28 + Math.min(d.functions_count * 0.8, 14))
    .text(d => d.id);

  // Tick
  simulation.on('tick', () => {
    link
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  // Search
  document.getElementById('search').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    if (!q) {
      node.classed('dimmed', false);
      link.classed('dimmed', false);
      return;
    }
    node.classed('dimmed', d => {
      const match = d.id.toLowerCase().includes(q) || 
        d.key_functions.some(f => f.toLowerCase().includes(q));
      return !match;
    });
    link.classed('dimmed', true);
  });

  // Store for later
  window._graph = { nodes, links, node, link };
}

function selectNode(d) {
  selectedNode = d;
  const sidebar = document.getElementById('sidebar');
  document.getElementById('no-selection').style.display = 'none';
  document.getElementById('contract-detail').style.display = 'block';
  
  document.getElementById('detail-name').textContent = d.id;
  document.getElementById('detail-addr').textContent = d.address;
  const cat = document.getElementById('detail-category');
  cat.textContent = d.category;
  cat.style.background = d.color + '22';
  cat.style.color = d.color;
  
  // Links
  const linksDiv = document.getElementById('detail-links');
  linksDiv.innerHTML = '';
  d.links.forEach(l => {
    const div = document.createElement('div');
    div.className = 'legend-item';
    div.innerHTML = `<span class="legend-dot" style="background:${d.color}"></span> → ${l.to}`;
    linksDiv.appendChild(div);
  });

  // Functions
  document.getElementById('func-count').textContent = d.functions_count;
  const funcList = document.getElementById('func-list');
  funcList.innerHTML = '';
  d.key_functions.forEach(fn => {
    const li = document.createElement('li');
    li.className = 'func-item';
    li.innerHTML = `<div class="func-name">${fn}</div>`;
    li.onclick = () => {
      // Toggle detail
      const existing = li.querySelector('.func-detail');
      if (existing) { existing.remove(); return; }
      const detail = document.createElement('div');
      detail.className = 'func-detail open';
      detail.innerHTML = `
        <label>Function</label>
        <span>${fn}()</span>
        <label>Contract</label>
        <span>${d.id}</span>
        <label>Category</label>
        <span>${d.category}</span>
      `;
      li.appendChild(detail);
    };
    funcList.appendChild(li);
  });

  // Highlight connected
  if (window._graph) {
    const connected = new Set([d.id]);
    d.links.forEach(l => connected.add(l.to));
    window._graph.node.classed('dimmed', n => !connected.has(n.id));
    window._graph.link.classed('dimmed', l => {
      const src = typeof l.source === 'object' ? l.source.id : l.source;
      const tgt = typeof l.target === 'object' ? l.target.id : l.target;
      return !(src === d.id || tgt === d.id);
    });
  }
}

function deselectNode() {
  selectedNode = null;
  document.getElementById('no-selection').style.display = 'block';
  document.getElementById('contract-detail').style.display = 'none';
  if (window._graph) {
    window._graph.node.classed('dimmed', false);
    window._graph.link.classed('dimmed', false);
  }
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  sb.classList.toggle('hidden');
  const btn = document.querySelector('.toggle-btn');
  btn.textContent = sb.classList.contains('hidden') ? '◨ Show Panel' : '◧ Hide Panel';
}

function dragstarted(event, d) {
  if (!event.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
function dragended(event, d) {
  if (!event.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}

// Responsive resize
window.addEventListener('resize', () => {
  const container = document.getElementById('graph-container');
  d3.select('#graph-container svg')
    .attr('width', container.clientWidth)
    .attr('height', container.clientHeight);
  if (simulation) {
    simulation.force('center', d3.forceCenter(container.clientWidth / 2, container.clientHeight / 2));
    simulation.alpha(0.3).restart();
  }
});
</script>
</body>
</html>
