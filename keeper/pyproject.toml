[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keeper"
version = "0.1.0"
description = "AV Treasury Keeper Bot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "web3>=7.0.0",
    "aiohttp>=3.9.0",
    "ccxt>=4.0.0",
    "rich>=14.0.0",
    "textual>=3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
