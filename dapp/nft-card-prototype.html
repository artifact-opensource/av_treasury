<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AV LP Card — Quasi Crystal Mint</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #e0e0e0;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  h1 { font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 2px; }
  .subtitle { font-size: 0.62rem; color: #3a3a3a; margin-bottom: 20px; font-family: 'JetBrains Mono', monospace; }

  .card {
    width: 340px; height: 480px;
    background: #050505;
    border-radius: 18px;
    border: 1px solid #111;
    position: relative; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.9);
  }
  .card-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .card-vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
  }
  .card-border {
    position: absolute; inset: -1px; border-radius: 18px; pointer-events: none; z-index: 3;
    background: linear-gradient(135deg, var(--accent, #ffd700) 0%, transparent 30%, transparent 70%, var(--accent, #ffd700) 100%);
    opacity: 0.2;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    padding: 1px;
  }
  .card-info {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 16px 20px; z-index: 4;
    background: linear-gradient(transparent, rgba(0,0,0,0.92));
  }
  .card-info .label { font-size: 0.48rem; text-transform: uppercase; letter-spacing: 0.15em; color: #2a2a2a; margin-bottom: 2px; }
  .card-info .value { font-size: 0.82rem; font-weight: 600; color: #fff; font-family: 'JetBrains Mono', monospace; }
  .card-info .metrics { display: flex; gap: 14px; margin-top: 8px; }
  .card-info .metric .val { font-size: 0.68rem; font-weight: 600; color: var(--accent, #ffd700); font-family: 'JetBrains Mono', monospace; }
  .card-info .metric .lbl { font-size: 0.42rem; text-transform: uppercase; letter-spacing: 0.06em; color: #2a2a2a; }

  .controls { width: 340px; display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
  .control-group { background: #080808; border: 1px solid #111; border-radius: 10px; padding: 12px 14px; }
  .control-group h3 { font-size: 0.52rem; text-transform: uppercase; letter-spacing: 0.12em; color: #2a2a2a; margin-bottom: 8px; }
  .slider-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .slider-row:last-child { margin-bottom: 0; }
  .slider-row label { font-size: 0.58rem; color: #4a4a4a; width: 68px; flex-shrink: 0; font-family: 'JetBrains Mono', monospace; }
  input[type="range"] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 2px; background: #161616; border-radius: 1px; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 10px; height: 10px; background: var(--accent, #ffd700); border-radius: 50%; cursor: pointer;
  }
  .slider-row .val { font-size: 0.58rem; color: #666; width: 28px; text-align: right; font-family: 'JetBrains Mono', monospace; }

  .scenarios { display: flex; gap: 4px; flex-wrap: wrap; }
  .scenario-btn {
    padding: 4px 10px; background: #0e0e0e; border: 1px solid #181818;
    border-radius: 5px; color: #3a3a3a; font-size: 0.58rem; cursor: pointer; transition: all 0.15s;
    font-family: 'JetBrains Mono', monospace;
  }
  .scenario-btn:hover { background: #161616; color: #666; }
  .scenario-btn.active { background: rgba(255,215,0,0.06); border-color: rgba(255,215,0,0.25); color: #ffd700; }

  .mint-section { width: 340px; display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .mint-btn {
    width: 100%; padding: 14px; background: linear-gradient(135deg, #0a0a0a, #111);
    border: 1px solid #1a1a1a; border-radius: 10px;
    color: #ffd700; font-size: 0.72rem; font-weight: 600; cursor: pointer;
    transition: all 0.2s; letter-spacing: 0.08em; text-transform: uppercase;
    font-family: 'JetBrains Mono', monospace;
    position: relative; overflow: hidden;
  }
  .mint-btn:hover { border-color: rgba(255,215,0,0.3); background: linear-gradient(135deg, #0c0c0c, #141414); }
  .mint-btn:active { transform: scale(0.98); }
  .mint-btn .shimmer {
    position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,215,0,0.06), transparent);
    animation: shimmer 2.5s infinite;
  }
  @keyframes shimmer { 0% { left: -100%; } 100% { left: 100%; } }

  .mint-counter {
    text-align: center; font-size: 0.52rem; color: #1a1a1a;
    font-family: 'JetBrains Mono', monospace; margin-top: 2px;
  }

  /* Gallery */
  .gallery-section { width: 340px; margin-top: 16px; }
  .gallery-label { font-size: 0.52rem; text-transform: uppercase; letter-spacing: 0.12em; color: #1a1a1a; margin-bottom: 8px; }
  .gallery-strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .gallery-strip::-webkit-scrollbar { height: 2px; }
  .gallery-strip::-webkit-scrollbar-track { background: #0a0a0a; }
  .gallery-strip::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 1px; }

  .gallery-item {
    width: 52px; height: 72px; flex-shrink: 0;
    background: #050505; border: 1px solid #111; border-radius: 6px;
    position: relative; overflow: hidden; cursor: pointer; transition: all 0.15s;
  }
  .gallery-item:hover { border-color: #2a2a2a; transform: translateY(-2px); }
  .gallery-item canvas { width: 100%; height: 100%; display: block; }
  .gallery-item .gallery-tag {
    position: absolute; bottom: 2px; left: 2px; right: 2px;
    font-size: 0.3rem; color: #3a3a3a; text-align: center;
    font-family: 'JetBrains Mono', monospace;
  }
</style>
</head>
<body>

<h1>AV LP Card</h1>
<p class="subtitle">quasi-crystalline · softmax · argmax · on-chain metrics</p>

<div class="card" id="card">
  <svg class="card-svg" id="cardSvg" viewBox="0 0 340 480"></svg>
  <div class="card-vignette"></div>
  <div class="card-border" id="cardBorder"></div>
  <div class="card-info">
    <div class="label">LP Position #0001</div>
    <div class="value" id="positionId">AG 12,450 · AU 2,490</div>
    <div class="metrics">
      <div class="metric"><div class="val" id="volValue">+2.4%</div><div class="lbl">Vol 24h</div></div>
      <div class="metric"><div class="val" id="tvlValue">$8,240</div><div class="lbl">TVL</div></div>
      <div class="metric"><div class="val" id="kValue">k = 31.0M</div><div class="lbl">Constant</div></div>
    </div>
  </div>
</div>

<div class="controls">
  <div class="control-group">
    <h3>Position Data</h3>
    <div class="slider-row"><label>Ag</label><input type="range" id="agReserve" min="100" max="100000" value="12450"><span class="val" id="agReserveVal">12K</span></div>
    <div class="slider-row"><label>Au</label><input type="range" id="auReserve" min="100" max="50000" value="2490"><span class="val" id="auReserveVal">2.5K</span></div>
    <div class="slider-row"><label>Volume</label><input type="range" id="volume" min="0" max="100" value="34"><span class="val" id="volumeVal">34</span></div>
    <div class="slider-row"><label>Volatility</label><input type="range" id="volatility" min="0" max="100" value="28"><span class="val" id="volatilityVal">28</span></div>
    <div class="slider-row"><label>Liquidity</label><input type="range" id="liquidity" min="0" max="100" value="72"><span class="val" id="liquidityVal">72</span></div>
    <div class="slider-row"><label>Age</label><input type="range" id="timeHeld" min="1" max="365" value="90"><span class="val" id="timeHeldVal">90d</span></div>
  </div>
  <div class="control-group">
    <h3>Scenarios</h3>
    <div class="scenarios">
      <button class="scenario-btn active" data-scenario="normal">Normal</button>
      <button class="scenario-btn" data-scenario="vol">Vol Spike</button>
      <button class="scenario-btn" data-scenario="whale">Whale</button>
      <button class="scenario-btn" data-scenario="deep">Deep Liq</button>
      <button class="scenario-btn" data-scenario="fresh">Fresh</button>
      <button class="scenario-btn" data-scenario="dormant">Dormant</button>
    </div>
  </div>
</div>

<div class="mint-section">
  <button class="mint-btn" id="mintBtn">
    <span class="shimmer"></span>
    ◆ MINT NEW CARD
  </button>
  <div class="mint-counter" id="mintCounter">minted: 0</div>
</div>

<div class="gallery-section">
  <div class="gallery-label">← Recently Minted →</div>
  <div class="gallery-strip" id="galleryStrip"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// Quasi-Crystalline Pattern Generator
// Faithful port of quasi.js by Robin Darobin
// ═══════════════════════════════════════════════════════════════

function quasiCrystal(symmetry, lines, seed) {
  let s = seed;
  const cx = 170, cy = 240;
  const scale = 14;
  const offsetX = 2, offsetY = 2;
  const win = 20;
  const halfMax = lines / 2;

  const vx = [], vy = [], mm = [], b = [];
  for (let t = 0; t < symmetry; t++) {
    const phi = (t * 2) / symmetry * Math.PI;
    vx[t] = Math.cos(phi);
    vy[t] = Math.sin(phi);
    mm[t] = vy[t] / vx[t];
    b[t] = [];
    for (let r = 0; r < lines; r++) {
      const y1 = vy[t] * (t * 0.1132) - vx[t] * (r - halfMax);
      const x1 = vx[t] * (t * 0.2137) + vy[t] * (r - halfMax);
      b[t][r] = y1 - mm[t] * x1;
    }
  }

  const polygons = [];
  const diagonals = [];
  const maxMax = lines - 1;
  const theMax = lines - 1;
  const theMin = Math.floor(theMax / 2);

  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;

  for (let minMin = 0; minMin <= theMax; minMin += 0.4) {
    const rad1 = minMin * minMin;
    const rad2 = (minMin + 0.4) * (minMin + 0.4);
    for (let n = 1; n < theMax; n++) {
      for (let m = 1; m < theMax; m++) {
        const rad = (n - theMin) * (n - theMin) + (m - theMin) * (m - theMin);
        if (rad < rad1 || rad >= rad2) continue;
        for (let t = 0; t < symmetry - 1; t++) {
          for (let r = t + 1; r < symmetry; r++) {
            const denom = mm[r] - mm[t];
            if (Math.abs(denom) < 1e-10) continue;
            const x0 = (b[t][n] - b[r][m]) / denom;
            const y0 = mm[t] * x0 + b[t][n];
            const dx0 = x0 / win, dy0 = y0 / win;
            if (dx0 < -0.3 || dx0 > 1.3 || dy0 < -0.3 || dy0 > 1.3) continue;

            let flag = false;
            const index = [];
            for (let i = 0; i < symmetry; i++) {
              if (i !== t && i !== r) {
                const ddx = -x0 * vy[i] + (y0 - b[i][0]) * vx[i];
                index[i] = Math.floor(-ddx);
                if (index[i] > maxMax - 3 || index[i] < 1) { flag = true; break; }
              }
            }
            if (flag) continue;

            index[t] = n - 1;
            index[r] = m - 1;

            let px = 0, py = 0;
            for (let i = 0; i < symmetry; i++) { px += vx[i] * index[i]; py += vy[i] * index[i]; }

            let colorVal = 0;
            for (let i = 0; i < symmetry; i++) colorVal += index[i];
            while (colorVal > (symmetry - 1) / 2) colorVal -= (symmetry - 1) / 2;
            colorVal = colorVal / ((symmetry - 1) / 2) * 0.8 + 0.1;
            colorVal += Math.abs(vx[t] * vx[r] + vy[t] * vy[r]);
            if (colorVal > 1) colorVal -= 1;

            minX = Math.min(minX, px); maxX = Math.max(maxX, px);
            minY = Math.min(minY, py); maxY = Math.max(maxY, py);

            const x1 = px, y1 = py;
            const x2 = px + vx[t], y2 = py + vy[t];
            const x3 = px + vx[t] + vx[r], y3 = py + vy[t] + vy[r];
            const x4 = px + vx[r], y4 = py + vy[r];

            polygons.push({
              rawPts: [
                [offsetX + (0.5 * (x1 / win + 1)) * scale, offsetY + (0.5 * (y1 / win + 1)) * scale],
                [offsetX + (0.5 * (x2 / win + 1)) * scale, offsetY + (0.5 * (y2 / win + 1)) * scale],
                [offsetX + (0.5 * (x3 / win + 1)) * scale, offsetY + (0.5 * (y3 / win + 1)) * scale],
                [offsetX + (0.5 * (x4 / win + 1)) * scale, offsetY + (0.5 * (y4 / win + 1)) * scale]
              ],
              color: colorVal
            });

            const mx1 = x1 + vx[t] * 0.5, my1 = y1 + vy[t] * 0.5;
            const mx2 = x2 + vx[r] * 0.5, my2 = y2 + vy[r] * 0.5;
            const mx3 = x4 + vx[t] * 0.5, my3 = y4 + vy[t] * 0.5;
            const mx4 = x3 + vx[r] * 0.5, my4 = y3 + vy[r] * 0.5;
            const ddx1 = mx1 - mx3, ddy1 = my1 - my3;
            const ddx2 = mx2 - mx4, ddy2 = my2 - my4;

            diagonals.push({
              d1: [mx1, my1, mx3, my3],
              d2: [mx2, my2, mx4, my4],
              dist1: ddx1*ddx1 + ddy1*ddy1,
              dist2: ddx2*ddx2 + ddy2*ddy2,
              color: colorVal
            });
          }
        }
      }
    }
  }

  const patW = maxX - minX || 1, patH = maxY - minY || 1;
  const targetW = 240, targetH = 320;
  const scaleFit = Math.min(targetW / patW, targetH / patH) * 0.78;
  const shiftX = cx - (minX + patW / 2) * scaleFit;
  const shiftY = cy - (minY + patH / 2) * scaleFit;

  const tx = pt => [pt[0] * scaleFit + shiftX, pt[1] * scaleFit + shiftY];

  return {
    polygons: polygons.map(p => ({ points: p.rawPts.map(tx), color: p.color })),
    diagonals: diagonals.map(d => ({
      d1: [tx([d.d1[0], d.d1[1]]), tx([d.d1[2], d.d1[3]])],
      d2: [tx([d.d2[0], d.d2[1]]), tx([d.d2[2], d.d2[3]])],
      dist1: d.dist1, dist2: d.dist2,
      color: d.color
    }))
  };
}

// ═══════════════════════════════════════════════════════════════
// Softmax + Argmax
// ═══════════════════════════════════════════════════════════════

function softmax(v) {
  const mx = Math.max(...v);
  const e = v.map(x => Math.exp(x - mx));
  const s = e.reduce((a, b) => a + b, 0);
  return e.map(x => x / s);
}
function argmax(v) {
  let i = 0;
  for (let j = 1; j < v.length; j++) if (v[j] > v[i]) i = j;
  return i;
}

// ═══════════════════════════════════════════════════════════════
// Data → Visual Parameters
// ═══════════════════════════════════════════════════════════════

function toVis(p) {
  const tvl = p.ag + p.au * 20;
  const ratio = p.au / Math.max(p.ag, 1);
  const act = p.vol / 100;
  const stab = 1 - p.vlt / 100;
  const depth = p.liq / 100;
  const age = Math.min(p.time / 180, 1);

  const w = softmax([
    act * 3 + p.vol / 40,
    stab * 3 + p.liq / 40,
    depth * 2.5 + tvl / 40000,
    p.vlt / 25 + (1 - stab) * 1.5,
    age * 2.5 + p.time / 150
  ]);
  const dom = argmax(w);

  const balance = Math.max(0, 1 - Math.abs(ratio - 0.2) / 0.3);
  const symmetry = Math.max(3, Math.round(3 + balance * 4 + act * 2));
  const lines = Math.max(10, Math.round(10 + Math.min(tvl / 25000, 12)));
  const seed = ((p.ag * 7919 + p.au * 104729) % 2147483646) + 1;

  const health = stab * 0.4 + depth * 0.4 + age * 0.2;

  const palettes = [
    { base: [255, 180, 40],  mid: [255, 100, 20],  light: [255, 230, 120], glow: [255, 60, 0]   },
    { base: [40, 200, 255],  mid: [20, 130, 220],  light: [120, 240, 255], glow: [0, 80, 200]   },
    { base: [60, 230, 150],  mid: [20, 160, 100],  light: [120, 255, 190], glow: [0, 120, 80]   },
    { base: [255, 60, 150],  mid: [180, 30, 100],  light: [255, 130, 200], glow: [140, 0, 80]   },
    { base: [230, 180, 60],  mid: [160, 110, 30],  light: [255, 230, 100], glow: [120, 80, 20]   },
  ];

  const palette = palettes[dom];
  const palette2 = palettes[(dom + 2) % 5];
  const blend = Math.min(1, p.vlt / 100 * 0.5 + act * 0.3);

  const blendColor = (c1, c2, t) => [
    Math.round(c1[0] + (c2[0] - c1[0]) * t),
    Math.round(c1[1] + (c2[1] - c1[1]) * t),
    Math.round(c1[2] + (c2[2] - c1[2]) * t)
  ];

  const baseC = blendColor(palette.base, palette2.base, blend);
  const midC = blendColor(palette.mid, palette2.mid, blend);
  const lightC = blendColor(palette.light, palette2.light, blend);
  const glowC = blendColor(palette.glow, palette2.glow, blend);
  const accentHex = `rgb(${baseC[0]},${baseC[1]},${baseC[2]})`;

  return { symmetry, lines, seed, baseC, midC, lightC, glowC, accentHex, dom, health, act };
}

// ═══════════════════════════════════════════════════════════════
// Render SVG (main card)
// ═══════════════════════════════════════════════════════════════

function colorFromVal(c, baseC, midC, lightC, glowC) {
  let r, g, b;
  if (c < 0.33) {
    const t = c / 0.33;
    r = Math.round(baseC[0] + (midC[0] - baseC[0]) * t);
    g = Math.round(baseC[1] + (midC[1] - baseC[1]) * t);
    b = Math.round(baseC[2] + (midC[2] - baseC[2]) * t);
  } else if (c < 0.66) {
    const t = (c - 0.33) / 0.33;
    r = Math.round(midC[0] + (lightC[0] - midC[0]) * t);
    g = Math.round(midC[1] + (lightC[1] - midC[1]) * t);
    b = Math.round(midC[2] + (lightC[2] - midC[2]) * t);
  } else {
    const t = (c - 0.66) / 0.34;
    r = Math.round(lightC[0] + (glowC[0] - lightC[0]) * t);
    g = Math.round(lightC[1] + (glowC[1] - lightC[1]) * t);
    b = Math.round(lightC[2] + (glowC[2] - lightC[2]) * t);
  }
  return [r, g, b];
}

function render(vis) {
  const svg = document.getElementById('cardSvg');
  const { symmetry, lines, seed, baseC, midC, lightC, glowC } = vis;
  const data = quasiCrystal(symmetry, lines, seed);
  const { polygons, diagonals } = data;

  let paths = '';
  polygons.forEach(p => {
    const d = 'M' + p.points.map(pt => `${pt[0].toFixed(1)},${pt[1].toFixed(1)}`).join('L') + 'Z';
    const [r, g, b] = colorFromVal(p.color, baseC, midC, lightC, glowC);
    const fillOp = 0.25 + p.color * 0.4;
    const strokeOp = 0.5 + p.color * 0.5;
    const strokeW = 0.6 + p.color * 1.0;
    paths += `<path d="${d}" fill="rgb(${r},${g},${b})" fill-opacity="${fillOp.toFixed(2)}" stroke="rgb(${r},${g},${b})" stroke-width="${strokeW.toFixed(1)}" stroke-opacity="${strokeOp.toFixed(2)}"/>`;
  });

  let diags = '';
  diagonals.forEach(d => {
    const [d1x1, d1y1, d1x2, d1y2] = d.dist1 <= d.dist2 ? d.d1 : d.d2;
    const [r, g, b] = d.color < 0.5 ? lightC : glowC;
    const op = 0.15 + d.color * 0.25;
    diags += `<line x1="${d1x1.toFixed(1)}" y1="${d1y1.toFixed(1)}" x2="${d1x2.toFixed(1)}" y2="${d1y2.toFixed(1)}" stroke="rgb(${r},${g},${b})" stroke-width="0.5" stroke-opacity="${op.toFixed(2)}"/>`;
  });

  const ringData = quasiCrystal(symmetry, Math.max(5, Math.floor(lines * 0.5)), seed + 12345);
  let ring = '';
  ringData.polygons.forEach(p => {
    const d = 'M' + p.points.map(pt => `${(pt[0] * 1.035).toFixed(1)},${(pt[1] * 1.035).toFixed(1)}`).join('L') + 'Z';
    ring += `<path d="${d}" fill="none" stroke="rgb(${baseC[0]},${baseC[1]},${baseC[2]})" stroke-width="0.4" stroke-opacity="0.12"/>`;
  });

  svg.innerHTML = ring + paths + diags;
  document.getElementById('cardBorder').style.setProperty('--accent', vis.accentHex);
  document.getElementById('card').style.setProperty('--accent', vis.accentHex);
}

// ═══════════════════════════════════════════════════════════════
// Render thumbnail to canvas (for gallery)
// ═══════════════════════════════════════════════════════════════

function renderThumb(vis, canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width = 104;
  const h = canvas.height = 144;
  const { symmetry, lines, seed, baseC, midC, lightC, glowC } = vis;

  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, w, h);

  const data = quasiCrystal(symmetry, lines, seed);

  // Scale down for thumbnail
  const sx = w / 340, sy = h / 480;

  data.polygons.forEach(p => {
    const [r, g, b] = colorFromVal(p.color, baseC, midC, lightC, glowC);
    ctx.beginPath();
    ctx.moveTo(p.points[0][0] * sx, p.points[0][1] * sy);
    ctx.lineTo(p.points[1][0] * sx, p.points[1][1] * sy);
    ctx.lineTo(p.points[2][0] * sx, p.points[2][1] * sy);
    ctx.lineTo(p.points[3][0] * sx, p.points[3][1] * sy);
    ctx.closePath();
    ctx.fillStyle = `rgba(${r},${g},${b},${(0.25 + p.color * 0.4).toFixed(2)})`;
    ctx.fill();
    ctx.strokeStyle = `rgba(${r},${g},${b},${(0.5 + p.color * 0.5).toFixed(2)})`;
    ctx.lineWidth = 0.3;
    ctx.stroke();
  });
}

// ═══════════════════════════════════════════════════════════════
// Gallery
// ═══════════════════════════════════════════════════════════════

let mintedCards = [];
let mintCount = 0;

function addToGallery(vis, id) {
  mintedCards.unshift({ vis, id, timestamp: Date.now() });
  if (mintedCards.length > 20) mintedCards.pop();

  const strip = document.getElementById('galleryStrip');
  strip.innerHTML = '';

  mintedCards.slice(0, 12).forEach((card, i) => {
    const item = document.createElement('div');
    item.className = 'gallery-item';
    item.title = `Card #${card.id}`;
    const canvas = document.createElement('canvas');
    item.appendChild(canvas);

    const tag = document.createElement('div');
    tag.className = 'gallery-tag';
    tag.textContent = `#${card.id}`;
    item.appendChild(tag);

    renderThumb(card.vis, canvas);

    item.addEventListener('click', () => {
      loadCard(card);
    });

    strip.appendChild(item);
  });
}

function loadCard(card) {
  const v = card.vis;
  // Reconstruct position data from the vis
  const p = v._positionData;
  if (!p) return;

  document.getElementById('agReserve').value = p.ag;
  document.getElementById('auReserve').value = p.au;
  document.getElementById('volume').value = p.vol;
  document.getElementById('volatility').value = p.vlt;
  document.getElementById('liquidity').value = p.liq;
  document.getElementById('timeHeld').value = p.time;

  updateUI(p);
  render(v);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateUI(p) {
  document.getElementById('agReserveVal').textContent = p.ag > 1000 ? (p.ag/1000).toFixed(1)+'K' : p.ag;
  document.getElementById('auReserveVal').textContent = p.au > 1000 ? (p.au/1000).toFixed(1)+'K' : p.au;
  document.getElementById('volumeVal').textContent = p.vol;
  document.getElementById('volatilityVal').textContent = p.vlt;
  document.getElementById('liquidityVal').textContent = p.liq;
  document.getElementById('timeHeldVal').textContent = p.time+'d';

  document.getElementById('positionId').textContent = `AG ${p.ag.toLocaleString()} · AU ${p.au.toLocaleString()}`;
  document.getElementById('volValue').textContent = `+${(p.vol*0.07).toFixed(1)}%`;
  document.getElementById('tvlValue').textContent = `$${((p.ag+p.au*20)/1000).toFixed(1)}K`;
  document.getElementById('kValue').textContent = `k=${((p.ag*p.au)/1e6).toFixed(1)}M`;
}

// ═══════════════════════════════════════════════════════════════
// Mint New Card — Full randomization
// ═══════════════════════════════════════════════════════════════

function mintNewCard() {
  mintCount++;

  // Fully randomize position data — simulates a brand new LPNFT mint
  // Use exponential distribution for realistic reserve distributions
  const randExp = (min, max) => {
    const u = Math.random();
    return Math.round(min * Math.pow(max / min, u));
  };

  const ag = randExp(100, 100000);
  const au = randExp(50, 50000);
  const vol = Math.round(Math.random() * 100);
  const vlt = Math.round(Math.random() * 100);
  const liq = Math.round(Math.random() * 100);
  const time = Math.round(1 + Math.random() * 364);

  const vis = toVis({ ag, au, vol, vlt, liq, time });
  vis._positionData = { ag, au, vol, vlt, liq, time };

  // Update main card
  updateUI({ ag, au, vol, vlt, liq, time });
  render(vis);

  // Add to gallery
  addToGallery(vis, mintCount);

  // Update counter
  document.getElementById('mintCounter').textContent = `minted: ${mintCount}`;

  // Scroll to card
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ═══════════════════════════════════════════════════════════════
// Scenarios
// ═══════════════════════════════════════════════════════════════

const S = {
  normal:  { ag: 12450, au: 2490, vol: 34, vlt: 28, liq: 72, time: 90 },
  vol:     { ag: 12450, au: 2490, vol: 82, vlt: 89, liq: 55, time: 90 },
  whale:   { ag: 3200,  au: 640,  vol: 95, vlt: 78, liq: 30, time: 90 },
  deep:    { ag: 85000, au: 17000, vol: 18, vlt: 12, liq: 95, time: 200 },
  fresh:   { ag: 1200,  au: 240,  vol: 5,  vlt: 15, liq: 40, time: 1 },
  dormant: { ag: 12450, au: 2490, vol: 1,  vlt: 3,  liq: 72, time: 300 }
};

function apply(k) {
  const s = S[k];
  document.getElementById('agReserve').value = s.ag;
  document.getElementById('auReserve').value = s.au;
  document.getElementById('volume').value = s.vol;
  document.getElementById('volatility').value = s.vlt;
  document.getElementById('liquidity').value = s.liq;
  document.getElementById('timeHeld').value = s.time;
  update();
}

function update() {
  const ag = +document.getElementById('agReserve').value;
  const au = +document.getElementById('auReserve').value;
  const vol = +document.getElementById('volume').value;
  const vlt = +document.getElementById('volatility').value;
  const liq = +document.getElementById('liquidity').value;
  const time = +document.getElementById('timeHeld').value;

  updateUI({ ag, au, vol, vlt, liq, time });
  render(toVis({ ag, au, vol, vlt, liq, time }));
}

// ── Events ──
document.querySelectorAll('input[type="range"]').forEach(el => el.addEventListener('input', update));
document.querySelectorAll('.scenario-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.scenario-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    apply(btn.dataset.scenario);
  });
});
document.getElementById('mintBtn').addEventListener('click', mintNewCard);

// Initial render
update();
</script>
